name: Build Ola Sales Manager APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare website files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Inspect Android Gradle files
        run: |
          echo "ROOT BUILD FILE"
          cat android/build.gradle
          echo "APP BUILD FILE"
          cat android/app/build.gradle

      - name: Prepare Firebase configuration
        run: |
          cp google-services.json android/app/google-services.json

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Ola-Sales-Manager-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
