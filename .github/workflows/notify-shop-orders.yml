name: Ola Shop Order Notifications

'on':
workflow_dispatch:
schedule:
- cron: '*/5 * * * *'

jobs:
notify:
runs-on: ubuntu-latest

steps:
  - name: Check orders and send notifications
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    run: |
      python -m pip install firebase-admin

      cat > service-account.json <<'EOF'
      ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      EOF

      cat > notify.py <<'PY'
      import firebase_admin
      from firebase_admin import credentials, firestore, messaging

      cred = credentials.Certificate("service-account.json")
      firebase_admin.initialize_app(cred)

      db = firestore.client()

      token_doc = db.collection("settings").document("pushDevice").get()

      if not token_doc.exists:
          print("No registered phone token found.")
          raise SystemExit(1)

      token = token_doc.to_dict().get("token")

      if not token:
          print("Phone notification token is missing.")
          raise SystemExit(1)

      orders = db.collection("orders").where("status", "==", "pending").stream()

      for order in orders:
          data = order.to_dict()

          if data.get("notificationSent") is True:
              continue

          customer = data.get("customerName", "A customer")
          total = data.get("total", 0)

          message = messaging.Message(
              notification=messaging.Notification(
                  title="New Ola Shop Order!",
                  body=f"{customer} placed an order. Total: ₦{total:,.2f}"
              ),
              token=token
          )

          try:
              messaging.send(message)
              order.reference.update({"notificationSent": True})
              print(f"Notification sent for order {order.id}")
          except Exception as error:
              print(f"Could not notify order {order.id}: {error}")
      PY

      python notify.py
